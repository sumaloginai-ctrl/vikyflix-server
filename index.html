    <title>MovieFlix - Your Personal Cinema</title>
    <style>
      /* ============================================================
         Launch intro — "The Premiere"
         A projector lamp ignites, a light streak sweeps the frame,
         the Clap M materializes with a traveling sheen, then the
         wordmark rises in. Premium, restrained, ~2.9s.
         ============================================================ */
      #mf-intro {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030409;
        overflow: hidden;
        transition: opacity 0.5s ease;
      }
      #mf-intro.mf-intro-hide { opacity: 0; pointer-events: none; }

      /* ambient gold lamp */
      .mf-lamp {
        position: absolute;
        width: 46vw;
        height: 46vw;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(246, 196, 83, 0.22) 0%, rgba(232, 16, 46, 0.10) 42%, transparent 68%);
        filter: blur(6px);
        opacity: 0;
        transform: scale(0.6);
        animation: mf-lamp-on 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.12s forwards;
      }
      @keyframes mf-lamp-on {
        0% { opacity: 0; transform: scale(0.55); }
        40% { opacity: 1; }
        100% { opacity: 0.85; transform: scale(1); }
      }

      /* projector light streak */
      .mf-streak {
        position: absolute;
        top: -30%;
        left: -60%;
        width: 34%;
        height: 160%;
        transform: rotate(18deg) translateX(-40vw);
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.05) 30%, rgba(255, 244, 214, 0.5) 50%, rgba(255, 255, 255, 0.05) 70%, transparent 100%);
        filter: blur(10px);
        opacity: 0;
        animation: mf-streak-sweep 1.15s cubic-bezier(0.5, 0, 0.3, 1) 0.22s;
      }
      @keyframes mf-streak-sweep {
        0% { opacity: 0; transform: rotate(18deg) translateX(-40vw); }
        18% { opacity: 1; }
        100% { opacity: 0; transform: rotate(18deg) translateX(140vw); }
      }

      /* the mark */
      .mf-markwrap {
        position: relative;
        width: min(44vw, 186px);
        opacity: 0;
        filter: blur(14px);
        transform: scale(1.08);
        animation: mf-mark-in 1.05s cubic-bezier(0.22, 1, 0.36, 1) 0.78s forwards;
      }
      @keyframes mf-mark-in {
        0% { opacity: 0; filter: blur(14px); transform: scale(1.08); }
        55% { opacity: 1; }
        100% { opacity: 1; filter: blur(0); transform: scale(1); }
      }
      .mf-markwrap svg { display: block; width: 100%; height: auto; overflow: visible; }
      .mf-markwrap .mf-mark-shape { fill: #ffffff; }
      .mf-sheen-rect {
        fill: url(#mf-sheen-grad);
        clip-path: url(#mf-mark-clip);
        animation: mf-sheen-move 2.4s ease-in-out 0.9s infinite;
      }
      @keyframes mf-sheen-move { 0%, 46% { opacity: 0; } 52% { opacity: 1; } 78%, 100% { opacity: 0; } }

      /* wordmark */
      .mf-word {
        position: absolute;
        left: 50%;
        top: calc(50% + clamp(120px, 26vh, 190px));
        transform: translateX(-50%);
        display: flex;
        gap: clamp(3px, 1.6vw, 8px);
        font-family: 'Sora', 'Segoe UI', system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(15px, 4.6vw, 23px);
        letter-spacing: 0.1em;
        color: #f6f7fb;
      }
      .mf-word span {
        opacity: 0;
        transform: translateY(14px);
        filter: blur(6px);
        animation: mf-letter-rise 0.62s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .mf-word .mf-pop {
        font-size: 0.9em;
        align-self: center;
        filter: none;
        animation: mf-letter-rise 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, mf-pop-bounce 2.6s ease-in-out 2.5s infinite;
      }
      @keyframes mf-letter-rise { to { opacity: 1; transform: translateY(0); filter: blur(0); } }
      @keyframes mf-pop-bounce {
        0%, 82%, 100% { transform: translateY(0) rotate(0); }
        88% { transform: translateY(-3px) rotate(-8deg); }
        94% { transform: translateY(0) rotate(5deg); }
      }
      /* gold hairline under the wordmark */
      .mf-hairline {
        position: absolute;
        left: 50%;
        top: calc(50% + clamp(158px, 32vh, 226px));
        width: 0;
        height: 1px;
        transform: translateX(-50%);
        background: linear-gradient(90deg, transparent, rgba(246, 196, 83, 0.9), transparent);
        animation: mf-hairline-in 0.8s cubic-bezier(0.22, 1, 0.36, 1) 2.15s forwards;
      }
      @keyframes mf-hairline-in { from { width: 0; opacity: 0; } to { width: 52vw; max-width: 320px; opacity: 1; } }

      /* exit veil */
      .mf-veil { position: absolute; inset: 0; background: #030409; opacity: 0; pointer-events: none; }
      #mf-intro.mf-intro-exit .mf-veil { animation: mf-veil-in 0.34s ease-out forwards; }
      @keyframes mf-veil-in { to { opacity: 0.85; } }

      @media (prefers-reduced-motion: reduce) {
        .mf-lamp, .mf-streak, .mf-markwrap, .mf-word span, .mf-hairline { animation-duration: 0.01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
        .mf-sheen-rect { display: none; }
      }
    </style>
  </head>
  <body>
    <!-- Launch intro: the Clap M claps, then the app opens -->
    <div id="mf-intro" aria-hidden="true">

      <div class="mf-markwrap">

          <path class="mf-mark-shape" d="M36.7 53.5 Q41.5 50 43.6 55.6 L51.1 76.3 Q53.2 81.9 48.4 85.4 L18.6 107.1 Q13.8 110.6 11.7 105 L4.2 84.3 Q2.1 78.7 6.9 75.2 Z"/>
          <path class="mf-mark-shape" d="M101.7 28.2 Q106.4 24.5 108.5 30.1 L118.1 55 Q120.2 60.6 115.5 64.4 L82.4 90.9 Q77.7 94.7 75.5 89.1 L66 64.1 Q63.8 58.5 68.5 54.8 Z"/>

          <rect class="mf-sheen-rect" x="-80" y="-40" width="360" height="340"/>
        </svg>
      </div>
      <div class="mf-word" aria-label="MOVIEFLIX">
        <span style="animation-delay:1.9s">M</span>
        <span style="animation-delay:1.96s">O</span>
        <span style="animation-delay:2.02s">V</span>
        <span style="animation-delay:2.08s">I</span>
        <span style="animation-delay:2.14s">E</span>
        <span style="animation-delay:2.2s">F</span>
        <span style="animation-delay:2.26s">L</span>
        <span style="animation-delay:2.32s">I</span>
        <span style="animation-delay:2.38s">X</span>
        <span class="mf-pop" style="animation-delay:2.5s">🍿</span>
      </div>
      <div class="mf-hairline"></div>
      <div class="mf-veil"></div>
    </div>
    <script>
      (function () {
        // Launch intro is APP-ONLY: the plain website must open straight
        // onto the app with no animation.
        var isNative = !!(
          (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
          window.location.protocol === 'capacitor:' ||
          (window.location.hostname === 'localhost' && (!window.location.port || window.location.port === '80')) ||
          new URLSearchParams(window.location.search).get('app') === '1'
        );
        var intro = document.getElementById('mf-intro');
        if (!isNative) {
          if (intro && intro.parentNode) intro.parentNode.removeChild(intro);
          return;
        }
        var shownAt = Date.now();
        var MIN_DISPLAY = 2950;   // the clap sequence needs room to play
        // Hold the intro until the app's data is actually ready (movieflix-ready)
        // so the user sees ONE animation, not intro-then-loader. On very slow
        // networks the in-app loader takes over after this cap.
        var HARD_CAP = 8000;      // absolute safety net
        var hidden = false;
        function hide() {
          if (hidden || !intro) return;
          hidden = true;
          var wait = Math.max(0, MIN_DISPLAY - (Date.now() - shownAt));
          setTimeout(function () {
            intro.classList.add('mf-intro-exit');           // flash-cut frame
            setTimeout(function () {
              intro.classList.add('mf-intro-hide');         // then fade the layer
              setTimeout(function () { if (intro.parentNode) intro.parentNode.removeChild(intro); }, 600);
            }, 300);
          }, wait);
        }
        window.addEventListener('movieflix-ready', hide, { once: true });
        window.addEventListener('load', function () { setTimeout(hide, HARD_CAP - (Date.now() - shownAt)); });
        setTimeout(hide, HARD_CAP); // absolute safety net
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
